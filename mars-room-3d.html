<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!-- artifact:start -->
<title>Mars Bedroom</title>
<style>
  /* Layout: full-bleed 3D canvas; a quiet hint and one toggle pinned to the bottom edge. */
  :root {
    --ground: #140c08;
    --ink: #f4dcc0;
    --glass: rgba(40, 20, 12, 0.55);
    --edge: rgba(255, 200, 150, 0.22);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--ground); color: var(--ink); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#view:active { cursor: grabbing; }
  .bar {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 10px; align-items: center;
    padding: 6px 8px 6px 14px;
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 999px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: opacity 0.8s;
    max-width: calc(100vw - 32px);
  }
  .bar.quiet { opacity: 0.25; }
  .bar:hover { opacity: 1; }
  .bar span { white-space: nowrap; opacity: 0.85; }
  .bar button {
    font: inherit; color: var(--ink); background: rgba(255, 220, 190, 0.08);
    border: 1px solid var(--edge); border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }
  .bar button[aria-pressed="true"] { background: rgba(255, 190, 130, 0.22); }
  .bar button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ground); color: var(--ink); letter-spacing: 0.08em; transition: opacity 0.6s; pointer-events: none; }
  #loading.done { opacity: 0; }
</style>

<canvas id="view"></canvas>
<div id="loading">Pressurising habitat…</div>
<div class="bar" id="bar">
  <span>Drag to look around</span>
  <button id="paint" type="button" aria-pressed="true">Painted</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const rr = a => (rnd() * 2 - 1) * a;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mix = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const col = h => new THREE.Color(h).convertSRGBToLinear();
const V = (x, y, z) => new THREE.Vector3(x, y, z);

function makeSimplex(s) {
  let st = s;
  const r = () => (st = (st * 16807) % 2147483647, (st - 1) / 2147483646);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const gx = [1, -1, 1, -1, 1, -1, 0, 0], gy = [1, 1, -1, -1, 0, 0, 1, -1];
  const F2 = 0.5 * (Math.sqrt(3) - 1), G2 = (3 - Math.sqrt(3)) / 6;
  return (x, y) => {
    const s2 = (x + y) * F2, i = Math.floor(x + s2), j = Math.floor(y + s2);
    const t = (i + j) * G2, x0 = x - (i - t), y0 = y - (j - t);
    const i1 = x0 > y0 ? 1 : 0, j1 = 1 - i1;
    const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2, x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;
    const ii = i & 255, jj = j & 255;
    let n = 0, tt;
    tt = 0.5 - x0 * x0 - y0 * y0; if (tt > 0) { const gi = perm[ii + perm[jj]] & 7; tt *= tt; n += tt * tt * (gx[gi] * x0 + gy[gi] * y0); }
    tt = 0.5 - x1 * x1 - y1 * y1; if (tt > 0) { const gi = perm[ii + i1 + perm[jj + j1]] & 7; tt *= tt; n += tt * tt * (gx[gi] * x1 + gy[gi] * y1); }
    tt = 0.5 - x2 * x2 - y2 * y2; if (tt > 0) { const gi = perm[ii + 1 + perm[jj + 1]] & 7; tt *= tt; n += tt * tt * (gx[gi] * x2 + gy[gi] * y2); }
    return 70 * n;
  };
}
const SN = [makeSimplex(3), makeSimplex(17), makeSimplex(29), makeSimplex(41)];
const fbm = (n, x, y, o = 5) => { let a = 1, s = 0, t = 0; for (let k = 0; k < o; k++) { s += a * n(x, y); t += a; x *= 2.03; y *= 2.03; a *= 0.5; } return s / t; };

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function std(hex, rough = 0.8, extra = {}) {
  return new THREE.MeshStandardMaterial(Object.assign({ color: col(hex), roughness: rough, metalness: 0 }, extra));
}
function add(mesh, x = 0, y = 0, z = 0, parent = scene, cast = true) {
  mesh.position.set(x, y, z);
  mesh.castShadow = cast; mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// box with softly rounded edges (w along x, h along y, d along z)
function rbox(w, h, d, mat, r = 0.02) {
  r = Math.min(r, w / 3, h / 3, d / 3);
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(w - 2 * r, h - 2 * r, r * 0.6), {
    depth: Math.max(0.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 3, curveSegments: 4,
  });
  geo.translate(0, 0, -(d - 2 * r) / 2);
  return new THREE.Mesh(geo, mat);
}
function box(w, h, d, mat) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); }
// a limb: cylinder between two points with rounded ends
function limb(r, mat) {
  const g = new THREE.Group();
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 14), mat);
  const a = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat);
  const b = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat);
  for (const m of [cyl, a, b]) { m.castShadow = true; m.receiveShadow = true; g.add(m); }
  g.userData.set = (p, q) => {
    const d = q.clone().sub(p), len = d.length();
    cyl.position.copy(p).add(q).multiplyScalar(0.5);
    cyl.scale.set(1, len, 1);
    cyl.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
    a.position.copy(p); b.position.copy(q);
  };
  return g;
}

// ---------------------------------------------------------------------------
// Renderer, scene, camera
// ---------------------------------------------------------------------------
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const small = Math.min(innerWidth, innerHeight) < 700;
const PR = Math.min(devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(PR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.LinearEncoding;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(new THREE.Color(0.9, 0.44, 0.23), 0.0026);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 1200);
camera.position.set(0.25, 1.86, 1.25);

const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(-0.9, 0.74, -2.35);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 2.2;
controls.maxDistance = 4.6;
controls.minAzimuthAngle = -0.3;
controls.maxAzimuthAngle = 0.8;
controls.minPolarAngle = 1.05;
controls.maxPolarAngle = 1.62;
controls.rotateSpeed = 0.45;
controls.update();

// ---------------------------------------------------------------------------
// Lighting: low Martian sun beyond the window, warm strip lights inside
// ---------------------------------------------------------------------------
const SUN_DIR = V(0.52, 0.36, -0.78).normalize();
const sun = new THREE.DirectionalLight(new THREE.Color(1.0, 0.62, 0.36), 3.4);
const ROOM_C = V(0, 1, -0.5);
sun.position.copy(ROOM_C).addScaledVector(SUN_DIR, 30);
sun.target.position.copy(ROOM_C);
sun.castShadow = true;
sun.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 5, far: 60 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(new THREE.Color(1.0, 0.58, 0.36), new THREE.Color(0.2, 0.08, 0.04), 0.24));
const fill = new THREE.PointLight(new THREE.Color(1.0, 0.64, 0.42), 0.7, 9, 2);
fill.position.set(0.3, 2.0, -2.2);
scene.add(fill);
const bedGlow = new THREE.PointLight(new THREE.Color(1.0, 0.58, 0.34), 0.9, 4.5, 2);
bedGlow.position.set(2.2, 1.7, -0.6);
scene.add(bedGlow);

const LED = new THREE.MeshBasicMaterial({ color: new THREE.Color(5.0, 3.6, 2.3) });
function strip(w, h, d, x, y, z, light = 0.7) {
  add(box(w, h, d, LED), x, y, z, scene, false);
  if (light) {
    const p = new THREE.PointLight(new THREE.Color(1.0, 0.7, 0.48), light, 2.6, 2);
    p.position.set(x, y, z);
    scene.add(p);
  }
}

// ---------------------------------------------------------------------------
// Mars outside: sky dome, terrain with cliffs, scattered rocks
// ---------------------------------------------------------------------------
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSun: { value: SUN_DIR } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform vec3 uSun; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y, 0.0, 1.0);
      vec3 horizon = vec3(1.25, 0.66, 0.36);
      vec3 zen = vec3(0.62, 0.30, 0.17);
      vec3 c = mix(horizon, zen, pow(h, 0.55));
      float s = max(dot(d, uSun), 0.0);
      c += vec3(1.0, 0.72, 0.42) * (pow(s, 6.0) * 0.9 + pow(s, 90.0) * 3.0 + pow(s, 900.0) * 18.0);
      gl_FragColor = vec4(c, 1.0);
    }`,
}));
scene.add(sky);

function terrainH(x, z) {
  const d = -z;
  let h = -1.2 + 0.7 * fbm(SN[0], x * 0.018, z * 0.018, 4) + 0.25 * fbm(SN[1], x * 0.07, z * 0.07, 3);
  const start = 175 + 35 * fbm(SN[2], x * 0.006, 3.7, 3);
  const m = smoothstep(start, start + 70, d + 25 * fbm(SN[3], x * 0.02, z * 0.02, 3));
  const ridge = 1 - Math.abs(fbm(SN[1], x * 0.011, z * 0.011 + 5, 5));
  let c = 40 + 30 * fbm(SN[3], x * 0.0045 + 3, z * 0.009, 5) + 30 * ridge * ridge + 10 * fbm(SN[0], x * 0.03, z * 0.03, 3);
  const step = 5.5, k = c / step, f = k - Math.floor(k);
  c = mix(c, (Math.floor(k) + smoothstep(0.6, 1, f)) * step, 0.55); // eroded terraces
  h += m * c;
  h += smoothstep(300, 380, d) * (55 + 40 * fbm(SN[0], x * 0.0035, z * 0.0035 + 9, 4));
  return h;
}
(function buildTerrain() {
  const geo = new THREE.PlaneGeometry(900, 640, 360, 300);
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, 0, -330);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, terrainH(pos.getX(i), pos.getZ(i)));
  geo.computeVertexNormals();
  const nor = geo.attributes.normal, colors = new Float32Array(pos.count * 3);
  const sand = col('#c2622f'), dark = col('#8a3a1b'), light = col('#dc8a52'), cliff = col('#8e4224'), cliffLit = col('#c86e3e'), band = col('#6e2e17');
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const steep = 1 - nor.getY(i);
    const n = fbm(SN[2], x * 0.04, z * 0.04, 3);
    c.copy(sand).lerp(n > 0 ? light : dark, Math.abs(n) * 1.1);
    const s = smoothstep(0.18, 0.45, steep);
    const strata = 0.5 + 0.5 * Math.sin(y * 1.1 + fbm(SN[3], x * 0.02, z * 0.02, 2) * 4);
    const cl = cliff.clone().lerp(cliffLit, smoothstep(-0.2, 0.6, nor.getX(i))).lerp(band, strata * 0.35);
    c.lerp(cl, s);
    const shade = clamp(nor.getX(i) * 0.55 + nor.getY(i) * 0.45 + nor.getZ(i) * 0.5, 0, 1);
    c.multiplyScalar(mix(0.45, 1.5, shade));
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const grit = canvasTex(256, 256, (x, w, h) => {
    x.fillStyle = '#d8d0c8'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) {
      const v = 120 + Math.floor(rnd() * 135);
      x.fillStyle = `rgb(${v},${v - 8},${v - 14})`;
      const s = 1 + rnd() * 3;
      x.fillRect(rnd() * w, rnd() * h, s, s * 0.6);
    }
  }, [90, 60]);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, map: grit }));
  mesh.receiveShadow = false;
  scene.add(mesh);

  // rocks
  const rg = new THREE.IcosahedronGeometry(1, 1);
  const rp = rg.attributes.position;
  for (let i = 0; i < rp.count; i++) {
    const v = V(rp.getX(i), rp.getY(i), rp.getZ(i));
    const k = 1 + 0.28 * SN[0](v.x * 1.7 + v.z, v.y * 1.7) + 0.12 * SN[1](v.y * 3, v.x * 3);
    rp.setXYZ(i, v.x * k, v.y * k * 0.62, v.z * k);
  }
  rg.computeVertexNormals();
  const N = small ? 2400 : 4500;
  const rocks = new THREE.InstancedMesh(rg, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, flatShading: true }), N);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = V(1, 1, 1), p = V(0, 0, 0);
  const rc = [col('#7a3218'), col('#94401e'), col('#5e2410'), col('#a8522a')];
  for (let i = 0; i < N; i++) {
    const d = 12 + Math.pow(rnd(), 1.5) * 150;
    const x = rr(1) * (25 + d * 1.05);
    const z = -d;
    const big = rnd() < 0.05 ? 3.2 : 1;
    const s = (0.06 + Math.pow(rnd(), 3) * 0.5 * big) * (0.45 + d / 60);
    p.set(x, terrainH(x, z) + s * 0.15, z);
    e.set(rr(0.3), rnd() * 6.28, rr(0.3));
    q.setFromEuler(e);
    sc.set(s * (0.8 + rnd() * 0.6), s, s * (0.8 + rnd() * 0.6));
    m4.compose(p, q, sc);
    rocks.setMatrixAt(i, m4);
    rocks.setColorAt(i, rc[Math.floor(rnd() * rc.length)]);
  }
  scene.add(rocks);
})();

// ---------------------------------------------------------------------------
// The habitat room
// ---------------------------------------------------------------------------
const X0 = -4.0, X1 = 4.6, ZW = -3.0, CEIL = 3.4;
const panelTex = canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = '#efe4d6'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) { x.fillStyle = `rgba(120,80,50,${rnd() * 0.05})`; x.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 30, 1 + rnd() * 3); }
  x.strokeStyle = 'rgba(70,40,25,0.55)'; x.lineWidth = 3;
  x.strokeRect(6, 6, w - 12, h - 12);
  x.beginPath(); x.moveTo(w / 2, 0); x.lineTo(w / 2, h * 0.35); x.stroke();
  x.fillStyle = 'rgba(80,50,30,0.5)';
  for (const [a, b] of [[30, 30], [w - 40, 30], [30, h - 40], [w - 40, h - 40]]) x.fillRect(a, b, 8, 8);
}, [1, 1]);
const SHELL = std('#e9dccb', 0.72, { map: panelTex });
const SHELL2 = std('#d8c4ad', 0.8);
const DARK = std('#3a2a22', 0.85);

// window wall: one thick, bevelled shell with the panoramic opening cut out
(function windowWall() {
  const s = new THREE.Shape();
  s.moveTo(X0, 0); s.lineTo(X1, 0); s.lineTo(X1, CEIL); s.lineTo(X0, CEIL); s.lineTo(X0, 0);
  const hole = new THREE.Path();
  hole.moveTo(-2.55, 1.02);
  hole.lineTo(3.0, 1.02);
  hole.quadraticCurveTo(3.55, 1.02, 3.55, 1.6);
  hole.quadraticCurveTo(3.58, 2.7, 3.15, 3.28);
  hole.lineTo(-3.15, 3.28);
  hole.lineTo(-2.55, 1.02);
  s.holes.push(hole);
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.32, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.07, bevelSegments: 4, curveSegments: 24 });
  geo.translate(0, 0, ZW - 0.32);
  const tex = panelTex.clone(); tex.needsUpdate = true; tex.repeat.set(0.45, 0.45);
  add(new THREE.Mesh(geo, std('#eadccb', 0.7, { map: tex })));
  // ribs of the dome-like window
  const rib = (pts, r) => {
    const curve = new THREE.CatmullRomCurve3(pts.map(p => V(...p)));
    add(new THREE.Mesh(new THREE.TubeGeometry(curve, 48, r, 12), std('#efe2d0', 0.6)));
  };
  rib([[-0.42, 3.45, -3.32], [-0.12, 2.6, -3.18], [0.05, 1.7, -3.14], [0.1, 1.0, -3.14]], 0.1);
  rib([[-3.2, 3.4, -3.08], [-2.85, 2.2, -3.04], [-2.56, 1.0, -3.04]], 0.09);
  rib([[3.05, 3.45, -3.12], [3.48, 2.6, -3.08], [3.58, 1.6, -3.06], [3.25, 1.0, -3.06]], 0.09);
  // sill and its light strip
  add(rbox(6.3, 0.07, 0.36, std('#f0e2cf', 0.55), 0.025), 0.4, 1.0, -2.88);
  strip(1.9, 0.022, 0.02, -0.95, 0.975, -2.69, 0.9);
})();

// floor
const floorTex = canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = '#d4bba6'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 400; i++) { x.fillStyle = `rgba(90,50,30,${rnd() * 0.06})`; x.fillRect(rnd() * w, rnd() * h, 10 + rnd() * 80, 2 + rnd() * 6); }
  x.strokeStyle = 'rgba(60,30,18,0.6)'; x.lineWidth = 3;
  x.strokeRect(0, 0, w, h);
  x.beginPath(); x.moveTo(0, h / 2); x.lineTo(w, h / 2); x.stroke();
}, [4, 4]);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(X1 - X0, 7.5), std('#ead8c6', 0.36, { map: floorTex }));
floor.rotation.x = -Math.PI / 2;
add(floor, (X0 + X1) / 2, 0, ZW + 3.75, scene, false);
// ceiling and side walls
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(X1 - X0, 7.5), std('#7a5a48', 0.9));
ceil.rotation.x = Math.PI / 2;
add(ceil, (X0 + X1) / 2, CEIL, ZW + 3.5);
const wallTex = panelTex.clone(); wallTex.needsUpdate = true; wallTex.repeat.set(2.4, 1.2);
const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(7.5, CEIL), std('#d6c0a6', 0.8, { map: wallTex }));
leftWall.rotation.y = Math.PI / 2;
add(leftWall, X0, CEIL / 2, ZW + 3.75);
const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(7.5, CEIL), std('#cdb69b', 0.8, { map: wallTex }));
rightWall.rotation.y = -Math.PI / 2;
add(rightWall, X1, CEIL / 2, ZW + 3.75);
// a slanted panel bridging the left wall and the window frame
const slant = new THREE.Mesh(new THREE.PlaneGeometry(1.4, CEIL), SHELL);
slant.rotation.y = Math.PI / 2 - 0.75;
add(slant, -3.55, CEIL / 2, -2.6);

// light strips
strip(0.035, 1.25, 0.05, -3.96, 1.95, -1.55, 0.9);            // tall strip on the left wall

const BX = 0.55, BZ0 = -1.05, BZ1 = 3.7, BTOP = 0.6;

function duvetH(s, t) {
  return BTOP + 0.035 * fbm(SN[0], s * 1.2, t * 1.2, 3) + 0.03 * Math.sin(s * 3.1 + t * 1.3 + fbm(SN[1], s, t, 2) * 3) + 0.008 * SN[2](s * 3, t * 3);
}
function drapeGeometry(sMin, sMax, tMin, tMax, ns, nt, mapST, lift) {
  const geo = new THREE.PlaneGeometry(1, 1, ns, nt);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  const R = 0.13, L1 = Math.PI / 2 * R;
  for (let i = 0; i < pos.count; i++) {
    const [s, t] = mapST(uv.getX(i), uv.getY(i));
    const top = duvetH(Math.max(s, 0), t) + lift;
    let x, y;
    if (s >= 0) { x = BX + s; y = top; }
    else if (s > -L1) { const th = -s / R; x = BX - R * Math.sin(th); y = top - R + R * Math.cos(th); }
    else { x = BX - R; y = top - R - (-s - L1); }
    if (s < 0) x -= 0.02 * SN[3](t * 3, s * 6) + 0.012; // hanging folds
    pos.setXYZ(i, x, y, t);
  }
  geo.computeVertexNormals();
  return geo;
}

const leafGeo = (() => {
  const g = new THREE.PlaneGeometry(1, 1, 6, 2);

    p.setXYZ(i, x, y * w * 2, x * x * 0.22 + Math.abs(y) * w * 0.4);
  }
  g.computeVertexNormals();
  return g;
})();
const leafMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide });
const leafCols = [col('#4f6a2c'), col('#5e7a34'), col('#3e5524'), col('#7a8a3a')];
function leafBatch(list, parent = scene) {
  const mesh = new THREE.InstancedMesh(leafGeo, leafMat, list.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(0, 0, 0, 'YZX');
  list.forEach((l, i) => {
    e.set(l.roll || 0, l.yaw, l.pitch);
    q.setFromEuler(e);
    m4.compose(l.p, q, V(l.len, l.len, l.len));
    mesh.setMatrixAt(i, m4);
    mesh.setColorAt(i, leafCols[Math.floor(rnd() * leafCols.length)]);
  });
  mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

  head.rotation.x = -0.32 + Math.sin(t * 0.5) * 0.04;
  head.rotation.y = Math.sin(t * 0.33) * 0.05;
  torso.updateMatrixWorld();
  shoulderR.set(0.2, 0.43, 0).applyMatrix4(torso.matrixWorld);
  shoulderL.set(-0.2, 0.43, 0).applyMatrix4(torso.matrixWorld);
  const hand = V(CX + 0.42 + write * 0.012 * pause + Math.sin(t * 0.9) * 0.02, 0.83 + Math.abs(Math.sin(t * 7)) * 0.006 * pause, CZ - 0.78);
  const elbow = V(CX + 0.33, 0.82, CZ - 0.32);
  upperR.userData.set(shoulderR, elbow);
  foreR.userData.set(elbow, hand);
  handR.position.copy(hand);
  band.position.copy(elbow).lerp(hand, 0.78);
  band.lookAt(hand);
  pen.position.copy(hand).add(V(0.01, 0.06, 0.02));
  pen.rotation.set(0.5, 0, -0.25 - write * 0.08);
  const handLp = V(CX + 0.02, 0.81, CZ - 0.74);
  const elbowL = V(CX - 0.26, 0.8, CZ - 0.36);
  upperL.userData.set(shoulderL, elbowL);
  foreL.userData.set(elbowL, handLp);
  handL.position.copy(handLp);
}

// ---------------------------------------------------------------------------
// Atmosphere: light shafts through the window, dust in the air
// ---------------------------------------------------------------------------
(function shafts() {
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
    uniforms: { uStrength: { value: 0.07 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform float uStrength; varying vec2 vUv;
      void main(){
        float a = pow(1.0 - vUv.y, 1.6) * sin(3.14159 * vUv.x) * uStrength;
        gl_FragColor = vec4(vec3(1.0, 0.62, 0.32) * a, 1.0);
      }`,
  });
  const into = SUN_DIR.clone().negate();
  for (let i = 0; i < 9; i++) {
    const x = mix(-2.3, 3.2, i / 8) + rr(0.25);
    const y0 = 1.05 + rnd() * 0.3, y1 = 2.6 + rnd() * 0.6, len = 4.5 + rnd() * 2;
    const a = V(x, y0, -3.0), b = V(x, y1, -3.0);
    const c = b.clone().addScaledVector(into, len), d = a.clone().addScaledVector(into, len);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([...a.toArray(), ...b.toArray(), ...c.toArray(), ...d.toArray()], 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
    geo.setIndex([0, 1, 2, 0, 2, 3]);
    const m = new THREE.Mesh(geo, mat);
    m.renderOrder = 2;
    scene.add(m);
  }
})();
const dust = (() => {
  const N = 320, pos = new Float32Array(N * 3), base = [];
  for (let i = 0; i < N; i++) base.push([mix(-2.8, 2.6, rnd()), mix(0.4, 3.0, rnd()), mix(-2.9, 1.0, rnd()), rnd() * 6.28, 0.2 + rnd() * 0.5]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const sprite = canvasTex(64, 64, (x, w, h) => {
    const gr = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,0.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = gr; x.fillRect(0, 0, w, h);
  });
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.018, map: sprite, color: new THREE.Color(2.2, 1.4, 0.8), transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true, fog: false,
  }));
  scene.add(pts);
  return { update(t) {
    for (let i = 0; i < N; i++) {
      const b = base[i];
      pos[i * 3] = b[0] + Math.sin(t * b[4] + b[3]) * 0.12 + ((t * 0.02 + b[3]) % 0.4);
      pos[i * 3 + 1] = b[1] + Math.cos(t * b[4] * 0.7 + b[3]) * 0.08;
      pos[i * 3 + 2] = b[2] + Math.sin(t * b[4] * 0.5 + b[3] * 2) * 0.1;
    }
    geo.attributes.position.needsUpdate = true;
  } };
})();

// ---------------------------------------------------------------------------
// Post-processing: painterly Kuwahara filter, bloom, filmic grade
// ---------------------------------------------------------------------------
const gl2 = renderer.capabilities.isWebGL2;
const hdrType = gl2 ? THREE.HalfFloatType : THREE.UnsignedByteType;
const rtScene = gl2 ? new THREE.WebGLMultisampleRenderTarget(1, 1, { type: hdrType, format: THREE.RGBAFormat })
                    : new THREE.WebGLRenderTarget(1, 1, { type: hdrType, format: THREE.RGBAFormat });
const rtPaint = new THREE.WebGLRenderTarget(1, 1, { type: hdrType, depthBuffer: false });
const rtBright = new THREE.WebGLRenderTarget(1, 1, { type: hdrType, depthBuffer: false });
const rtBlurA = new THREE.WebGLRenderTarget(1, 1, { type: hdrType, depthBuffer: false });
const rtBlurB = new THREE.WebGLRenderTarget(1, 1, { type: hdrType, depthBuffer: false });
const quadVS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const pass = (fs, uniforms) => new THREE.ShaderMaterial({ vertexShader: quadVS, fragmentShader: fs, uniforms, depthTest: false, depthWrite: false });
const KR = small ? 2 : 3;
const quadrant = (xs, xe, ys, ye, k) => `
  for (int j = ${ys}; j <= ${ye}; j++) for (int i = ${xs}; i <= ${xe}; i++) {
    vec3 c = texture2D(tDiffuse, vUv + vec2(float(i), float(j)) * uTexel).rgb;
    m${k} += c; s${k} += c * c;
  }`;
const kuwahara = pass(`
  uniform sampler2D tDiffuse; uniform vec2 uTexel; varying vec2 vUv;
  void main(){
    vec3 m0 = vec3(0.0), m1 = vec3(0.0), m2 = vec3(0.0), m3 = vec3(0.0);
    vec3 s0 = vec3(0.0), s1 = vec3(0.0), s2 = vec3(0.0), s3 = vec3(0.0);
    ${quadrant(-KR, 0, -KR, 0, 0)}
    ${quadrant(0, KR, -KR, 0, 1)}
    ${quadrant(0, KR, 0, KR, 2)}
    ${quadrant(-KR, 0, 0, KR, 3)}
    float n = ${((KR + 1) * (KR + 1)).toFixed(1)};
    vec3 best = m0 / n; vec3 v = abs(s0 / n - best * best); float bv = v.r + v.g + v.b;
    vec3 mm = m1 / n; v = abs(s1 / n - mm * mm); float vv = v.r + v.g + v.b; if (vv < bv) { bv = vv; best = mm; }
    mm = m2 / n; v = abs(s2 / n - mm * mm); vv = v.r + v.g + v.b; if (vv < bv) { bv = vv; best = mm; }
    mm = m3 / n; v = abs(s3 / n - mm * mm); vv = v.r + v.g + v.b; if (vv < bv) { bv = vv; best = mm; }
    gl_FragColor = vec4(best, 1.0);
  }`, { tDiffuse: { value: null }, uTexel: { value: new THREE.Vector2() } });
const bright = pass(`
  uniform sampler2D tDiffuse; varying vec2 vUv;
  void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; float l = max(max(c.r, c.g), c.b); gl_FragColor = vec4(c * smoothstep(0.9, 2.2, l), 1.0); }`,
  { tDiffuse: { value: null } });
const blur = pass(`
  uniform sampler2D tDiffuse; uniform vec2 uDir; varying vec2 vUv;
  void main(){
    vec3 c = texture2D(tDiffuse, vUv).rgb * 0.227;
    c += (texture2D(tDiffuse, vUv + uDir * 1.385).rgb + texture2D(tDiffuse, vUv - uDir * 1.385).rgb) * 0.316;
    c += (texture2D(tDiffuse, vUv + uDir * 3.231).rgb + texture2D(tDiffuse, vUv - uDir * 3.231).rgb) * 0.070;
    gl_FragColor = vec4(c, 1.0);
  }`, { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2() } });
const finalPass = pass(`
  uniform sampler2D tScene; uniform sampler2D tPaint; uniform sampler2D tBloom;
  uniform float uPaint; uniform float uTime; uniform vec2 uRes; varying vec2 vUv;
  vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
  float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
  void main(){
    vec3 c = mix(texture2D(tScene, vUv).rgb, texture2D(tPaint, vUv).rgb, uPaint);
    c += texture2D(tBloom, vUv).rgb * 0.75;
    c *= 0.82;
    c = aces(c);
    c = pow(c, vec3(1.0 / 2.2));
    float l = dot(c, vec3(0.299, 0.587, 0.114));
    c = mix(vec3(l), c, 1.1);
    c = mix(c, c * vec3(1.06, 0.98, 0.9), 0.6);
    c += vec3(0.025, 0.01, 0.0) * (1.0 - l);   // warm lifted shadows
    vec2 q = vUv - 0.5;
    c *= mix(0.62, 1.0, smoothstep(0.85, 0.25, length(q * vec2(1.0, 1.15))));
    c += (hash(vUv * uRes + uTime) - 0.5) * 0.035;
    gl_FragColor = vec4(c, 1.0);
  }`, {
  tScene: { value: null }, tPaint: { value: null }, tBloom: { value: null },
  uPaint: { value: 1 }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2() },
});
const quadScene = new THREE.Scene(), quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), kuwahara);
quad.frustumCulled = false;
quadScene.add(quad);
const runPass = (mat, target) => { quad.material = mat; renderer.setRenderTarget(target); renderer.render(quadScene, quadCam); };

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 1 ? 74 : 58;
  camera.updateProjectionMatrix();
  const pw = Math.floor(w * PR), ph = Math.floor(h * PR);
  rtScene.setSize(pw, ph); rtPaint.setSize(pw, ph);
  rtBright.setSize(pw >> 1, ph >> 1); rtBlurA.setSize(pw >> 2, ph >> 2); rtBlurB.setSize(pw >> 2, ph >> 2);
  kuwahara.uniforms.uTexel.value.set(1 / pw, 1 / ph);
  finalPass.uniforms.uRes.value.set(pw, ph);
}
addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// UI + loop
// ---------------------------------------------------------------------------
let painted = true;
const btn = document.getElementById('paint');
btn.addEventListener('click', () => { painted = !painted; btn.setAttribute('aria-pressed', String(painted)); });
const bar = document.getElementById('bar');
setTimeout(() => bar.classList.add('quiet'), 6000);

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
let t = 0;
const sway = V(0, 0, 0);
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!reduceMotion) t += dt;
  controls.update();
  // a slow handheld drift on top of the user's view
  sway.set(Math.sin(t * 0.21) * 0.035, Math.sin(t * 0.17) * 0.02, 0);
  camera.position.add(sway);
  poseBoy(t);
  dust.update(t);
  vineGroups.forEach((gr, i) => { gr.rotation.z = Math.sin(t * 0.7 + i) * 0.03; gr.rotation.x = Math.sin(t * 0.5 + i * 2) * 0.02; });

  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);
  camera.position.sub(sway);
  if (painted) { kuwahara.uniforms.tDiffuse.value = rtScene.texture; runPass(kuwahara, rtPaint); }
  bright.uniforms.tDiffuse.value = rtScene.texture; runPass(bright, rtBright);
  blur.uniforms.tDiffuse.value = rtBright.texture; blur.uniforms.uDir.value.set(1 / rtBlurA.width, 0); runPass(blur, rtBlurA);
  blur.uniforms.tDiffuse.value = rtBlurA.texture; blur.uniforms.uDir.value.set(0, 1 / rtBlurA.height); runPass(blur, rtBlurB);
  blur.uniforms.tDiffuse.value = rtBlurB.texture; blur.uniforms.uDir.value.set(2 / rtBlurA.width, 0); runPass(blur, rtBlurA);
  blur.uniforms.tDiffuse.value = rtBlurA.texture; blur.uniforms.uDir.value.set(0, 2 / rtBlurA.height); runPass(blur, rtBlurB);
  finalPass.uniforms.tScene.value = rtScene.texture;
  finalPass.uniforms.tPaint.value = rtPaint.texture;
  finalPass.uniforms.tBloom.value = rtBlurB.texture;
  finalPass.uniforms.uPaint.value = painted ? 0.9 : 0;
  finalPass.uniforms.uTime.value = t % 10;
  runPass(finalPass, null);
  requestAnimationFrame(frame);
}
requestAnimationFrame(() => { frame(); document.getElementById('loading').classList.add('done'); });
})();
</script>
