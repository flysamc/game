<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!-- artifact:start -->
<title>Mars Bedroom</title>
<style>
  /* Layout: full-bleed 3D canvas; a quiet hint and one toggle pinned to the bottom edge. */
  :root {
    --ground: #140c08;
    --ink: #f4dcc0;
    --glass: rgba(40, 20, 12, 0.55);
    --edge: rgba(255, 200, 150, 0.22);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--ground); color: var(--ink); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#view:active { cursor: grabbing; }
  .bar {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 10px; align-items: center;
    padding: 6px 8px 6px 14px;
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 999px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: opacity 0.8s;
    max-width: calc(100vw - 32px);
  }
  .bar.quiet { opacity: 0.25; }
  .bar:hover { opacity: 1; }
  .bar span { white-space: nowrap; opacity: 0.85; }
  .bar button {
    font: inherit; color: var(--ink); background: rgba(255, 220, 190, 0.08);
    border: 1px solid var(--edge); border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }
  .bar button[aria-pressed="true"] { background: rgba(255, 190, 130, 0.22); }
  .bar button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ground); color: var(--ink); letter-spacing: 0.08em; transition: opacity 0.6s; pointer-events: none; }
  #loading.done { opacity: 0; }
</style>

<canvas id="view"></canvas>
<div id="loading">Pressurising habitat…</div>
<div class="bar" id="bar">
  <span>Drag to look around</span>
  <button id="paint" type="button" aria-pressed="true">Painted</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';

// ===========================================================================
// Helpers
// ===========================================================================
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const rr = a => (rnd() * 2 - 1) * a;
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mix = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const col = h => new THREE.Color(h).convertSRGBToLinear();
const V = (x, y, z) => new THREE.Vector3(x, y, z);

function makeSimplex(s) {
  let st = s;
  const r = () => (st = (st * 16807) % 2147483647, (st - 1) / 2147483646);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const gx = [1, -1, 1, -1, 1, -1, 0, 0], gy = [1, 1, -1, -1, 0, 0, 1, -1];
  const F2 = 0.5 * (Math.sqrt(3) - 1), G2 = (3 - Math.sqrt(3)) / 6;
  return (x, y) => {
    const s2 = (x + y) * F2, i = Math.floor(x + s2), j = Math.floor(y + s2);
    const t = (i + j) * G2, x0 = x - (i - t), y0 = y - (j - t);
    const i1 = x0 > y0 ? 1 : 0, j1 = 1 - i1;
    const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2, x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;
    const ii = i & 255, jj = j & 255;
    let n = 0, tt;
    tt = 0.5 - x0 * x0 - y0 * y0; if (tt > 0) { const gi = perm[ii + perm[jj]] & 7; tt *= tt; n += tt * tt * (gx[gi] * x0 + gy[gi] * y0); }
    tt = 0.5 - x1 * x1 - y1 * y1; if (tt > 0) { const gi = perm[ii + i1 + perm[jj + j1]] & 7; tt *= tt; n += tt * tt * (gx[gi] * x1 + gy[gi] * y1); }
    tt = 0.5 - x2 * x2 - y2 * y2; if (tt > 0) { const gi = perm[ii + 1 + perm[jj + 1]] & 7; tt *= tt; n += tt * tt * (gx[gi] * x2 + gy[gi] * y2); }
    return 70 * n;
  };
}
const SN = [makeSimplex(3), makeSimplex(17), makeSimplex(29), makeSimplex(41)];
const fbm = (n, x, y, o = 5) => { let a = 1, s = 0, t = 0; for (let k = 0; k < o; k++) { s += a * n(x, y); t += a; x *= 2.03; y *= 2.03; a *= 0.5; } return s / t; };

// ---- procedural textures --------------------------------------------------
function makeCanvas(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  return c;
}
function texFrom(c, repeat, srgb = true) {
  const t = new THREE.CanvasTexture(c);
  t.encoding = srgb ? THREE.sRGBEncoding : THREE.LinearEncoding;
  t.anisotropy = 8;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat[0], repeat[1]);
  return t;
}
const canvasTex = (w, h, draw, repeat) => texFrom(makeCanvas(w, h, draw), repeat);
// height drawing (white = high) -> tangent-space normal map
function normalTex(w, h, drawHeight, strength, repeat) {
  const src = makeCanvas(w, h, drawHeight).getContext('2d').getImageData(0, 0, w, h).data;
  const H = (i, j) => src[((((j % h) + h) % h) * w + (((i % w) + w) % w)) * 4] / 255;
  const out = makeCanvas(w, h, () => {});
  const ctx = out.getContext('2d'), img = ctx.createImageData(w, h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const dx = (H(i + 1, j) - H(i - 1, j)) * strength, dy = (H(i, j + 1) - H(i, j - 1)) * strength;
    const l = Math.hypot(dx, dy, 1), k = (j * w + i) * 4;
    img.data[k] = (-dx / l * 0.5 + 0.5) * 255;
    img.data[k + 1] = (dy / l * 0.5 + 0.5) * 255;
    img.data[k + 2] = (1 / l * 0.5 + 0.5) * 255;
    img.data[k + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return texFrom(out, repeat, false);
}
const cloneTex = (t, repeat) => { const c = t.clone(); c.needsUpdate = true; c.repeat.set(repeat[0], repeat[1]); return c; };

// ---- mesh helpers ---------------------------------------------------------
function std(hex, rough = 0.8, extra = {}) {
  return new THREE.MeshStandardMaterial(Object.assign({ color: col(hex), roughness: rough, metalness: 0 }, extra));
}
let scene;
function add(mesh, x = 0, y = 0, z = 0, parent = scene, cast = true) {
  mesh.position.set(x, y, z);
  mesh.traverse(o => { if (o.isMesh) { o.castShadow = cast; o.receiveShadow = true; } });
  parent.add(mesh);
  return mesh;
}
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// box with softly rounded edges (w along x, h along y, d along z)
function rbox(w, h, d, mat, r = 0.02) {
  r = Math.min(r, w / 3, h / 3, d / 3);
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(w - 2 * r, h - 2 * r, r * 0.6), {
    depth: Math.max(0.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 3, curveSegments: 4,
  });
  geo.translate(0, 0, -(d - 2 * r) / 2);
  // planar UVs in metres so tiling textures read at a consistent scale
  const p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) + p.getZ(i) * 0.7, p.getY(i) + p.getZ(i) * 0.3);
  return new THREE.Mesh(geo, mat);
}
const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
const cyl = (rt, rb, h, mat, seg = 20) => new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
const sphere = (r, mat, ws = 24, hs = 16) => new THREE.Mesh(new THREE.SphereGeometry(r, ws, hs), mat);
// a limb: cylinder between two points with rounded ends
function limb(r0, mat, r1 = r0) {
  const g = new THREE.Group();
  const c = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, 1, 16), mat);
  const a = sphere(r0, mat, 16, 12), b = sphere(r1, mat, 16, 12);
  for (const m of [c, a, b]) { m.castShadow = true; m.receiveShadow = true; g.add(m); }
  g.userData.set = (p, q) => {
    const d = q.clone().sub(p), len = d.length();
    c.position.copy(p).add(q).multiplyScalar(0.5);
    c.scale.set(1, len, 1);
    c.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
    a.position.copy(p); b.position.copy(q);
  };
  return g;
}

// ===========================================================================
// Renderer, scene, camera
// ===========================================================================
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const small = Math.min(innerWidth, innerHeight) < 700;
const PR = Math.min(devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(PR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.LinearEncoding;
renderer.toneMapping = THREE.NoToneMapping;

scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(new THREE.Color(0.9, 0.44, 0.23), 0.0024);
const camera = new THREE.PerspectiveCamera(56, innerWidth / innerHeight, 0.05, 1400);
camera.position.set(-0.3, 1.8, 0.85);

const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(-1.4, 0.84, -2.5);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 2.2;
controls.maxDistance = 4.6;
controls.minAzimuthAngle = -0.1;
controls.maxAzimuthAngle = 1.0;
controls.minPolarAngle = 1.1;
controls.maxPolarAngle = 1.66;
controls.rotateSpeed = 0.45;
controls.update();

// ===========================================================================
// Lighting: low Martian sun beyond the window, warm strip lights inside
// ===========================================================================
const SUN_DIR = V(0.5, 0.34, -0.8).normalize();
const sun = new THREE.DirectionalLight(new THREE.Color(1.0, 0.62, 0.36), 3.4);
const ROOM_C = V(-0.5, 1, -1.0);
sun.position.copy(ROOM_C).addScaledVector(SUN_DIR, 30);
sun.target.position.copy(ROOM_C);
sun.castShadow = true;
sun.shadow.mapSize.set(small ? 2048 : 4096, small ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -6.5, right: 6.5, top: 6.5, bottom: -6.5, near: 5, far: 60 });
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.015;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(new THREE.Color(1.0, 0.58, 0.36), new THREE.Color(0.2, 0.08, 0.04), 0.16));
const fill = new THREE.PointLight(new THREE.Color(1.0, 0.64, 0.42), 0.6, 9, 2);
fill.position.set(-0.5, 2.0, -2.2);
scene.add(fill);
const bedGlow = new THREE.PointLight(new THREE.Color(1.0, 0.58, 0.34), 0.7, 4.5, 2);
bedGlow.position.set(1.2, 1.7, -0.6);
scene.add(bedGlow);

const LED = new THREE.MeshBasicMaterial({ color: new THREE.Color(5.0, 3.6, 2.3) });
function strip(w, h, d, x, y, z, light = 0.7) {
  add(box(w, h, d, LED), x, y, z, scene, false);
  if (light) {
    const p = new THREE.PointLight(new THREE.Color(1.0, 0.7, 0.48), light, 2.6, 2);
    p.position.set(x, y, z);
    scene.add(p);
  }
}

// contact shadows: soft dark decals on the floor where objects meet it
const blobTex = canvasTex(128, 128, (x, w, h) => {
  const g = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.45, 'rgba(0,0,0,0.6)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
});
function contact(x, z, w, d, strength = 0.6, y = 0.004, rot = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({
    map: blobTex, transparent: true, opacity: strength, depthWrite: false, color: 0x1a0c06,
    polygonOffset: true, polygonOffsetFactor: -2,
  }));
  m.rotation.x = -Math.PI / 2; m.rotation.z = rot;
  m.position.set(x, y, z);
  m.renderOrder = 1;
  scene.add(m);
}

// ===========================================================================
// Mars outside: sky dome, mesa country, rocks and pebbles
// ===========================================================================
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1200, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSun: { value: SUN_DIR } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform vec3 uSun; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y, 0.0, 1.0);
      vec3 c = mix(vec3(1.25, 0.66, 0.36), vec3(0.62, 0.30, 0.17), pow(h, 0.55));
      float s = max(dot(d, uSun), 0.0);
      c += vec3(1.0, 0.72, 0.42) * (pow(s, 6.0) * 0.9 + pow(s, 90.0) * 3.0 + pow(s, 900.0) * 18.0);
      gl_FragColor = vec4(c, 1.0);
    }`,
})));

function terrainH(x, z) {
  const d = -z;
  let h = -1.2 + 0.7 * fbm(SN[0], x * 0.018, z * 0.018, 4) + 0.3 * fbm(SN[1], x * 0.07, z * 0.07, 3);
  // low dunes on the plain
  h += 0.5 * Math.pow(Math.abs(SN[2](x * 0.012, z * 0.03)), 1.5) * smoothstep(20, 80, d);
  const start = 175 + 35 * fbm(SN[2], x * 0.006, 3.7, 3);
  const m = smoothstep(start, start + 60, d + 25 * fbm(SN[3], x * 0.02, z * 0.02, 3));
  const ridge = 1 - Math.abs(fbm(SN[1], x * 0.011, z * 0.011 + 5, 5));
  let c = 38 + 30 * fbm(SN[3], x * 0.0045 + 3, z * 0.009, 5) + 26 * ridge * ridge + 8 * fbm(SN[0], x * 0.03, z * 0.03, 3);
  // flat mesa caps with a little erosion on top
  const cap = 52 + 22 * fbm(SN[2], x * 0.004, z * 0.004 + 4, 3);
  c = Math.min(c, cap) + Math.max(0, c - cap) * 0.12;
  const step = 6, k = c / step, f = k - Math.floor(k);
  c = mix(c, (Math.floor(k) + smoothstep(0.62, 1, f)) * step, 0.6); // terraced cliff bands
  h += m * c;
  h += smoothstep(320, 400, d) * (60 + 40 * fbm(SN[0], x * 0.0035, z * 0.0035 + 9, 4));
  return h;
}
(function buildTerrain() {
  const geo = new THREE.PlaneGeometry(900, 640, small ? 300 : 420, small ? 260 : 360);
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, 0, -330);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, terrainH(pos.getX(i), pos.getZ(i)));
  geo.computeVertexNormals();
  const nor = geo.attributes.normal, colors = new Float32Array(pos.count * 3);
  const sand = col('#c2622f'), dark = col('#8a3a1b'), light = col('#dc8a52');
  const cliff = col('#8e4224'), cliffLit = col('#d07a46'), band = col('#5e2612'), bandLight = col('#e09a62');
  const c = new THREE.Color(), cl = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const steep = 1 - nor.getY(i);
    const n = fbm(SN[2], x * 0.04, z * 0.04, 3);
    c.copy(sand).lerp(n > 0 ? light : dark, Math.abs(n) * 1.2);
    const s = smoothstep(0.14, 0.4, steep);
    const strata = Math.sin(y * 1.4 + fbm(SN[3], x * 0.02, z * 0.02, 2) * 3);
    cl.copy(cliff).lerp(cliffLit, smoothstep(-0.2, 0.6, nor.getX(i)));
    cl.lerp(strata > 0.55 ? bandLight : band, Math.abs(strata) * 0.35);
    c.lerp(cl, s);
    const shade = clamp(nor.getX(i) * 0.55 + nor.getY(i) * 0.45 + nor.getZ(i) * 0.5, 0, 1);
    c.multiplyScalar(mix(0.42, 1.55, shade));
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const grit = canvasTex(256, 256, (x, w, h) => {
    x.fillStyle = '#d8d0c8'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 3200; i++) {
      const v = 110 + Math.floor(rnd() * 145);
      x.fillStyle = `rgb(${v},${v - 8},${v - 14})`;
      const s = 1 + rnd() * 3;
      x.fillRect(rnd() * w, rnd() * h, s, s * 0.6);
    }
  }, [140, 100]);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, map: grit }));
  mesh.userData.outdoor = true;
  scene.add(mesh);

  const rockGeo = detail => {
    const rg = new THREE.IcosahedronGeometry(1, detail);
    const rp = rg.attributes.position;
    for (let i = 0; i < rp.count; i++) {
      const v = V(rp.getX(i), rp.getY(i), rp.getZ(i));
      const k = 1 + 0.3 * SN[0](v.x * 1.7 + v.z, v.y * 1.7) + 0.12 * SN[1](v.y * 3, v.x * 3);
      rp.setXYZ(i, v.x * k, Math.max(v.y * k * 0.62, -0.25), v.z * k);
    }
    rg.computeVertexNormals();
    return rg;
  };
  const scatter = (geo, N, dMin, dSpan, sizeFn, cols) => {
    const inst = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, flatShading: true }), N);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = V(1, 1, 1), p = V(0, 0, 0);
    for (let i = 0; i < N; i++) {
      const d = dMin + Math.pow(rnd(), 1.5) * dSpan;
      const x = rr(1) * (14 + d * 1.1), z = -d;
      const s = sizeFn(d);
      p.set(x, terrainH(x, z) + s * 0.1, z);
      e.set(rr(0.3), rnd() * 6.28, rr(0.3));
      q.setFromEuler(e);
      sc.set(s * (0.8 + rnd() * 0.6), s, s * (0.8 + rnd() * 0.6));
      m4.compose(p, q, sc);
      inst.setMatrixAt(i, m4);
      inst.setColorAt(i, pick(cols));
    }
    inst.userData.outdoor = true;
    scene.add(inst);
  };
  const rc = [col('#7a3218'), col('#94401e'), col('#5e2410'), col('#a8522a'), col('#b8643a')];
  scatter(rockGeo(1), small ? 2600 : 4600, 12, 150, d => (0.06 + Math.pow(rnd(), 3) * 0.5 * (rnd() < 0.05 ? 3.2 : 1)) * (0.45 + d / 60), rc);
  scatter(rockGeo(0), small ? 3000 : 7000, 10, 45, d => (0.03 + rnd() * rnd() * 0.12) * (0.6 + d / 30), rc);
})();

// ===========================================================================
// Materials for the habitat
// ===========================================================================
const X0 = -4.0, X1 = 4.6, ZW = -3.0, CEIL = 3.4;
const panelDraw = (x, w, h, height) => {
  x.fillStyle = height ? '#808080' : '#f0e6d8'; x.fillRect(0, 0, w, h);
  if (!height) for (let i = 0; i < 900; i++) { x.fillStyle = `rgba(120,80,50,${rnd() * 0.05})`; x.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 30, 1 + rnd() * 3); }
  x.strokeStyle = height ? '#202020' : 'rgba(70,40,25,0.5)';
  x.lineWidth = height ? 7 : 3;
  x.strokeRect(4, 4, w - 8, h - 8);
  x.beginPath(); x.moveTo(w / 2, 0); x.lineTo(w / 2, h * 0.35); x.stroke();
  if (height) { x.strokeStyle = '#a0a0a0'; x.lineWidth = 3; x.strokeRect(14, 14, w - 28, h - 28); }
  x.fillStyle = height ? '#303030' : 'rgba(80,50,30,0.5)';
  for (const [a, b] of [[28, 28], [w - 36, 28], [28, h - 36], [w - 36, h - 36]]) { x.beginPath(); x.arc(a + 4, b + 4, 5, 0, Math.PI * 2); x.fill(); }
};
const panelCol = canvasTex(512, 512, (x, w, h) => panelDraw(x, w, h, false), [1, 1]);
const panelNor = normalTex(512, 512, (x, w, h) => panelDraw(x, w, h, true), 2.5, [1, 1]);

function duvetH(s, t) {
  return BTOP + 0.04 * fbm(SN[0], s * 1.2, t * 1.2, 3) + 0.035 * Math.sin(s * 3.1 + t * 1.3 + fbm(SN[1], s, t, 2) * 3) + 0.008 * SN[2](s * 3, t * 3);
}
function drapeGeometry(ns, nt, mapST, lift) {
  const geo = new THREE.PlaneGeometry(1, 1, ns, nt);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  const R = 0.14, L1 = Math.PI / 2 * R;
  for (let i = 0; i < pos.count; i++) {
    const [s, t] = mapST(uv.getX(i), uv.getY(i));
    const top = duvetH(Math.max(s, 0), t) + lift;
    let x, y;
    if (s >= 0) { x = BX + s; y = top; }
    else if (s > -L1) { const th = -s / R; x = BX - R * Math.sin(th); y = top - R + R * Math.cos(th); }
    else { x = BX - R; y = top - R - (-s - L1); }
    if (s < 0) x -= 0.025 * SN[3](t * 3, s * 6) + 0.014; // hanging folds
    pos.setXYZ(i, x, y, t);
    uv.setXY(i, s, t);
  }
  geo.computeVertexNormals();
  return geo;
}

function makeLeafGeo(roundness) {
  const g = new THREE.PlaneGeometry(1, 1, 8, 3);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) + 0.5, y = p.getY(i);
    const w = Math.sin(Math.PI * Math.pow(x, roundness)) * (0.22 + roundness * 0.18);
    p.setXYZ(i, x, y * w * 2, x * x * 0.24 + Math.abs(y) * w * 0.5);
  }
  g.computeVertexNormals();
  return g;
}

const leafCols = [col('#3f5a24'), col('#4e6a2c'), col('#2f4a1e'), col('#62752e'), col('#56702c')];
function leafBatch(list, geo = leafGeo, parent = scene) {
  const mesh = new THREE.InstancedMesh(geo, leafMat, list.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(0, 0, 0, 'YZX');
  list.forEach((l, i) => {
    e.set(l.roll || 0, l.yaw, l.pitch);
    q.setFromEuler(e);
    m4.compose(l.p, q, V(l.len, l.len, l.len));
    mesh.setMatrixAt(i, m4);
    mesh.setColorAt(i, pick(leafCols));
  });
  mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

const kuwahara = pass(`
  uniform sampler2D tDiffuse; uniform vec2 uTexel; varying vec2 vUv;
  void main(){
    vec3 m0 = vec3(0.0), m1 = vec3(0.0), m2 = vec3(0.0), m3 = vec3(0.0);
    vec3 s0 = vec3(0.0), s1 = vec3(0.0), s2 = vec3(0.0), s3 = vec3(0.0);
    ${quadrant(-KR, 0, -KR, 0, 0)}
    ${quadrant(0, KR, -KR, 0, 1)}
    ${quadrant(0, KR, 0, KR, 2)}
    ${quadrant(-KR, 0, 0, KR, 3)}
    float n = ${((KR + 1) * (KR + 1)).toFixed(1)};
    vec3 best = m0 / n; vec3 v = abs(s0 / n - best * best); float bv = v.r + v.g + v.b;
    vec3 mm = m1 / n; v = abs(s1 / n - mm * mm); float vv = v.r + v.g + v.b; if (vv < bv) { bv = vv; best = mm; }
    mm = m2 / n; v = abs(s2 / n - mm * mm); vv = v.r + v.g + v.b; if (vv < bv) { bv = vv; best = mm; }
    mm = m3 / n; v = abs(s3 / n - mm * mm); vv = v.r + v.g + v.b; if (vv < bv) { bv = vv; best = mm; }
    gl_FragColor = vec4(best, 1.0);
  }`, { tDiffuse: { value: null }, uTexel: { value: new THREE.Vector2() } });
const bright = pass(`
  uniform sampler2D tDiffuse; varying vec2 vUv;
  void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; float l = max(max(c.r, c.g), c.b); gl_FragColor = vec4(c * smoothstep(0.9, 2.2, l), 1.0); }`,
  { tDiffuse: { value: null } });
const blur = pass(`
  uniform sampler2D tDiffuse; uniform vec2 uDir; varying vec2 vUv;
  void main(){
    vec3 c = texture2D(tDiffuse, vUv).rgb * 0.227;
    c += (texture2D(tDiffuse, vUv + uDir * 1.385).rgb + texture2D(tDiffuse, vUv - uDir * 1.385).rgb) * 0.316;
    c += (texture2D(tDiffuse, vUv + uDir * 3.231).rgb + texture2D(tDiffuse, vUv - uDir * 3.231).rgb) * 0.070;
    gl_FragColor = vec4(c, 1.0);
  }`, { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2() } });
const finalPass = pass(`
  uniform sampler2D tScene; uniform sampler2D tPaint; uniform sampler2D tBloom;
  uniform float uPaint; uniform float uTime; uniform vec2 uRes; uniform vec2 uTexel; varying vec2 vUv;
  vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
  float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
  void main(){
    vec3 sc = texture2D(tScene, vUv).rgb;
    vec3 pt = texture2D(tPaint, vUv).rgb;
    // keep a touch of the crisp render's edges under the paint
    vec3 blurS = (texture2D(tScene, vUv + vec2(uTexel.x, 0.0)).rgb + texture2D(tScene, vUv - vec2(uTexel.x, 0.0)).rgb
                + texture2D(tScene, vUv + vec2(0.0, uTexel.y)).rgb + texture2D(tScene, vUv - vec2(0.0, uTexel.y)).rgb) * 0.25;
    vec3 c = mix(sc, pt, uPaint) + (sc - blurS) * 0.35 * uPaint;
    c += texture2D(tBloom, vUv).rgb * 0.75;
    c *= 0.72;
    c = aces(c);
    c = pow(c, vec3(1.0 / 2.2));
    float l = dot(c, vec3(0.299, 0.587, 0.114));
    c = mix(vec3(l), c, 1.18);
    c = (c - 0.5) * 1.06 + 0.5;
    c = mix(c, c * vec3(1.06, 0.98, 0.9), 0.6);
    c += vec3(0.025, 0.01, 0.0) * (1.0 - l);
    vec2 q = vUv - 0.5;
    c *= mix(0.6, 1.0, smoothstep(0.85, 0.25, length(q * vec2(1.0, 1.15))));
    c += (hash(vUv * uRes + uTime) - 0.5) * 0.03;
    gl_FragColor = vec4(c, 1.0);
  }`, {
  tScene: { value: null }, tPaint: { value: null }, tBloom: { value: null },
  uPaint: { value: 1 }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2() }, uTexel: { value: new THREE.Vector2() },
});
const quadScene = new THREE.Scene(), quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), kuwahara);
quad.frustumCulled = false;
quadScene.add(quad);
const runPass = (mat, target) => { quad.material = mat; renderer.setRenderTarget(target); renderer.render(quadScene, quadCam); };

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 1 ? 74 : 56;
  camera.updateProjectionMatrix();
  const pw = Math.floor(w * PR), ph = Math.floor(h * PR);
  rtScene.setSize(pw, ph); rtPaint.setSize(pw, ph);
  rtBright.setSize(pw >> 1, ph >> 1); rtBlurA.setSize(pw >> 2, ph >> 2); rtBlurB.setSize(pw >> 2, ph >> 2);
  kuwahara.uniforms.uTexel.value.set(1 / pw, 1 / ph);
  finalPass.uniforms.uTexel.value.set(1 / pw, 1 / ph);
  finalPass.uniforms.uRes.value.set(pw, ph);
}
addEventListener('resize', resize);
resize();

// ===========================================================================
// UI + loop
// ===========================================================================
let painted = true;
const btn = document.getElementById('paint');
btn.addEventListener('click', () => { painted = !painted; btn.setAttribute('aria-pressed', String(painted)); });
const bar = document.getElementById('bar');
setTimeout(() => bar.classList.add('quiet'), 6000);

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
let t = 0;
const sway = V(0, 0, 0);
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!reduceMotion) t += dt;
  controls.update();
  sway.set(Math.sin(t * 0.21) * 0.03, Math.sin(t * 0.17) * 0.018, 0);
  camera.position.add(sway);
  poseBoy(t);
  dust.update(t);
  vineGroups.forEach((gr, i) => { gr.rotation.z = Math.sin(t * 0.7 + i) * 0.03; gr.rotation.x = Math.sin(t * 0.5 + i * 2) * 0.02; });

  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);
  camera.position.sub(sway);
  if (painted) { kuwahara.uniforms.tDiffuse.value = rtScene.texture; runPass(kuwahara, rtPaint); }
  bright.uniforms.tDiffuse.value = rtScene.texture; runPass(bright, rtBright);
  blur.uniforms.tDiffuse.value = rtBright.texture; blur.uniforms.uDir.value.set(1 / rtBlurA.width, 0); runPass(blur, rtBlurA);
  blur.uniforms.tDiffuse.value = rtBlurA.texture; blur.uniforms.uDir.value.set(0, 1 / rtBlurA.height); runPass(blur, rtBlurB);
  blur.uniforms.tDiffuse.value = rtBlurB.texture; blur.uniforms.uDir.value.set(2 / rtBlurA.width, 0); runPass(blur, rtBlurA);
  blur.uniforms.tDiffuse.value = rtBlurA.texture; blur.uniforms.uDir.value.set(0, 2 / rtBlurA.height); runPass(blur, rtBlurB);
  finalPass.uniforms.tScene.value = rtScene.texture;
  finalPass.uniforms.tPaint.value = rtPaint.texture;
  finalPass.uniforms.tBloom.value = rtBlurB.texture;
  finalPass.uniforms.uPaint.value = painted ? 0.85 : 0;
  finalPass.uniforms.uTime.value = t % 10;
  runPass(finalPass, null);
  requestAnimationFrame(frame);
}
requestAnimationFrame(() => { frame(); document.getElementById('loading').classList.add('done'); });
})();
</script>
