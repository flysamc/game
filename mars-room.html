<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!-- artifact:start -->
<title>Mars Bedroom</title>
<style>
  /* Layout: one painted frame, letterboxed to fit any screen. */
  :root { --letterbox: #120c09; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--letterbox); display: grid; place-items: center; }
  canvas { display: block; }
</style>

<canvas id="scene" role="img" aria-label="A boy writing at his desk in a Mars habitat bedroom, warm orange light pouring through a curved panoramic window over a rocky red desert"></canvas>

<script>
(() => {
'use strict';

// Logical frame, laid out in the coordinates of the reference still.
const FW = 1905, FH = 1042, OX = 62, OY = 210;

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
let g, seed = 1, S = 1; // S: device pixels per logical pixel (for blur radii)
const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const rr = a => (rnd() * 2 - 1) * a;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mix = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function makeNoise(s) {
  const p = new Uint8Array(512);
  const base = Array.from({ length: 256 }, (_, i) => i);
  let st = s;
  const r = () => (st = (st * 16807) % 2147483647, (st - 1) / 2147483646);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [base[i], base[j]] = [base[j], base[i]]; }
  for (let i = 0; i < 512; i++) p[i] = base[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x) => (h & 1 ? -x : x) * (1 + (h >> 1 & 3) * 0.25);
  return x => {
    const i = Math.floor(x), f = x - i;
    return mix(grad(p[i & 255], f), grad(p[(i + 1) & 255], f - 1), fade(f)) * 1.6;
  };
}
const n1 = makeNoise(11), n2 = makeNoise(23), n3 = makeNoise(37);
const fbm = (n, x, o = 5) => { let a = 1, s = 0, t = 0; for (let k = 0; k < o; k++) { s += a * n(x); t += a; x *= 2.1; a *= 0.5; } return s / t; };

function P(pts) {
  const p = new Path2D();
  p.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
  p.closePath();
  return p;
}
function smooth(pts) {
  const p = new Path2D(), n = pts.length;
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const m0 = mid(pts[n - 1], pts[0]);
  p.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) {
    const a = pts[i], m = mid(a, pts[(i + 1) % n]);
    p.quadraticCurveTo(a[0], a[1], m[0], m[1]);
  }
  p.closePath();
  return p;
}
function blob(cx, cy, rx, ry, n = 9, j = 0.18, rot = 0) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = rot + i / n * Math.PI * 2, k = 1 + rr(j);
    pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  return smooth(pts);
}
function lg(x0, y0, x1, y1, ...stops) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  for (let i = 0; i < stops.length; i += 2) gr.addColorStop(stops[i], stops[i + 1]);
  return gr;
}
function rg(x, y, r0, r1, ...stops) {
  const gr = g.createRadialGradient(x, y, r0, x, y, r1);
  for (let i = 0; i < stops.length; i += 2) gr.addColorStop(stops[i], stops[i + 1]);
  return gr;
}
function fill(path, style, alpha = 1) {
  g.globalAlpha = alpha;
  g.fillStyle = style;
  g.fill(path);
  g.globalAlpha = 1;
}
function rect(x, y, w, h, style, alpha = 1) { g.globalAlpha = alpha; g.fillStyle = style; g.fillRect(x, y, w, h); g.globalAlpha = 1; }
function line(x1, y1, x2, y2, w, style, alpha = 1) {
  g.globalAlpha = alpha; g.strokeStyle = style; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.globalAlpha = 1;
}
function withClip(path, fn) { g.save(); g.clip(path); fn(); g.restore(); }
// painterly brush texture inside a shape
function brush(path, n, colors, len, wid, alpha, angle = 0, bounds) {
  withClip(path, () => {
    const [x0, y0, x1, y1] = bounds;
    for (let i = 0; i < n; i++) {
      const x = mix(x0, x1, rnd()), y = mix(y0, y1, rnd());
      const a = angle + rr(0.25), l = len * (0.5 + rnd());
      line(x, y, x + Math.cos(a) * l, y + Math.sin(a) * l, wid * (0.6 + rnd() * 0.8), colors[Math.floor(rnd() * colors.length)], alpha * (0.4 + rnd() * 0.6));
    }
  });
}
// glowing LED strip: soft halo passes plus a hot core
function glowStrip(x1, y1, x2, y2, w, strength = 1) {
  const stroke = (col, width, blur, shadow, alpha) => {
    g.globalAlpha = alpha; g.strokeStyle = col; g.lineWidth = width;
    g.shadowColor = shadow; g.shadowBlur = blur * S;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  };
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.lineCap = 'round';
  stroke('rgba(255,150,70,0.9)', w * 2.5, w * 12, 'rgba(255,130,50,1)', 0.75 * strength);
  stroke('rgba(255,170,90,0.9)', w * 2, w * 6, 'rgba(255,160,80,1)', 0.7 * strength);
  stroke('rgba(255,200,140,0.9)', w * 1.4, w * 2.5, 'rgba(255,200,140,1)', 0.8 * strength);
  stroke('#fff3dc', w, w * 0.8, '#ffe2b8', Math.min(1, strength));
  g.restore();
}

// ---------------------------------------------------------------------------
// Palette
// ---------------------------------------------------------------------------
const C = {
  deep: '#2a1710', shadow: '#4a2b1d', shadow2: '#5e3a28',
  wallLit: '#e2c29c', wallMid: '#b98f6c', wallDark: '#7a5440',
  frameLit: '#f3d6ae', frame: '#d4b08c', frameDark: '#8e6650',
  sky: '#f2b679', ground: '#bd5f31', groundFar: '#cf7a47',
  rock: '#6e2f18', rockLit: '#d27b47',
  led: '#fff1d6',
  hair: '#3a2216', hairLit: '#a0602f', skin: '#a8694a', skinLit: '#f0ad78',
  vest: '#4e4843', vestLit: '#9a8272', shirt: '#b8aa9c', shirtLit: '#f0d0aa',
  pants: '#3a2c28', shoe: '#cfc2b4',
  chair: '#5e534c', chairLit: '#c9ad8e', chairDark: '#2e2622', strap: '#b8702f',
  duvet: '#4a4456', duvetLit: '#93787a', duvetDark: '#24202c',
  blanket: '#9a4529', blanketLit: '#d9784a', blanketDark: '#5a2416',
  leaf: '#5d6b33', leafLit: '#b6a24e', leafDark: '#2f3518',
};

// window opening (the Martian view is painted inside this)
const WINDOW = (() => {
  const p = new Path2D();
  p.moveTo(418, 205);
  p.lineTo(1662, 205);
  p.quadraticCurveTo(1712, 330, 1722, 540);
  p.quadraticCurveTo(1724, 650, 1630, 668);
  p.lineTo(1250, 668);
  p.quadraticCurveTo(1190, 628, 1120, 606);
  p.lineTo(520, 606);
  p.lineTo(480, 420);
  p.closePath();
  return p;
})();

// ---------------------------------------------------------------------------
// Mars, seen through the window
// ---------------------------------------------------------------------------
function ridgeLayer(base, amp, freq, off, colTop, colBot, litCol, depth, sharp, streaks = true) {
  const xs = [], ys = [];
  for (let x = 400; x <= 1740; x += 3) {
    let v = clamp(0.5 + fbm(n1, x * freq + off, 6) * 1.1, 0, 1);
    const d = 1 - Math.abs(fbm(n3, x * freq * 3.2 + off, 3));
    v = Math.pow(v * 0.82 + d * 0.18, sharp);
    const plateau = smoothstep(0.55, 0.75, fbm(n2, x * freq * 0.5 + off * 2, 3) + 0.5);
    xs.push(x); ys.push(base - amp * mix(v, 0.85 + 0.1 * v, plateau * 0.6));
  }
  const pts = xs.map((x, i) => [x, ys[i]]);
  pts.push([1740, 700], [400, 700]);
  const path = P(pts);
  fill(path, lg(0, base - amp, 0, base + depth, 0, colTop, 1, colBot));
  // sunlit faces (slopes falling to the right catch the low sun) and erosion streaks
  if (streaks) withClip(path, () => {
    for (let i = 0; i < xs.length - 1; i++) {
      const dy = ys[i + 1] - ys[i];
      if (dy > 0.6) {
        const h = depth * (0.4 + rnd() * 0.6);
        rect(xs[i], ys[i], 3.2, h, lg(0, ys[i], 0, ys[i] + h, 0, litCol, 1, 'rgba(0,0,0,0)'), clamp(dy / 4, 0.15, 0.75));
      }
    }
    for (let i = 0; i < xs.length * 0.9; i++) {
      const k = Math.floor(rnd() * xs.length);
      const x = xs[k], y = ys[k] + rnd() * depth * 0.6;
      line(x, y, x + rr(3), y + 8 + rnd() * depth * 0.6, 1.5 + rnd() * 3, rnd() < 0.65 ? 'rgba(70,22,10,0.8)' : litCol, 0.3);
    }
  });
  return path;
}

function drawMars() {
  seed = 777;
  // hazy sky, brightest toward the low sun on the right
  rect(400, 200, 1340, 140, lg(0, 200, 0, 330, 0, '#f6c792', 1, '#e49a62'));
  rect(400, 200, 1340, 200, rg(1560, 210, 0, 520, 0, 'rgba(255,226,170,0.85)', 0.5, 'rgba(255,190,120,0.25)', 1, 'rgba(255,170,100,0)'));
  const haze = a => rect(400, 200, 1340, 480, '#eba06a', a);

  ridgeLayer(292, 96, 0.0026, 3.1, '#b8653c', '#94482a', '#f0aa72', 90, 1.1);
  haze(0.22);
  ridgeLayer(322, 74, 0.0038, 8.4, '#a8532f', '#7e3a20', '#ea9a62', 80, 1.3);
  haze(0.14);
  ridgeLayer(360, 44, 0.0058, 15.2, '#9c4a28', '#7a361c', '#e2905a', 60, 1.5);
  haze(0.1);
  // the open plain
  const plain = ridgeLayer(392, 12, 0.012, 22.7, '#c76d3c', '#b35529', '#e58f58', 40, 1, false);
  withClip(plain, () => {
    rect(400, 380, 1340, 320, lg(0, 380, 0, 680, 0, 'rgba(214,128,78,0.6)', 0.4, 'rgba(190,94,48,0.2)', 1, 'rgba(160,66,30,0.0)'));
    // dark and light patches, flattened by perspective
    for (let i = 0; i < 260; i++) {
      const y = 395 + 280 * Math.pow(rnd(), 0.9);
      const d = (y - 390) / 280;
      const rx = 10 + rnd() * 90 * (0.4 + d), ry = rx * (0.08 + 0.12 * d);
      fill(blob(400 + rnd() * 1340, y, rx, ry, 8, 0.3), rnd() < 0.55 ? '#8e3a1c' : '#e0915a', 0.12 + rnd() * 0.18);
    }
    // gravel streaks
    for (let i = 0; i < 900; i++) {
      const y = 400 + 270 * rnd(), d = (y - 390) / 280;
      const x = 400 + rnd() * 1340, l = 3 + rnd() * 18 * (0.3 + d);
      line(x, y, x + l, y + rr(0.6), 0.8 + d * 1.8, rnd() < 0.5 ? '#7f3218' : '#e8a06c', 0.18);
    }
  });
  // rocks, back to front
  const rocks = [];
  for (let i = 0; i < 1300; i++) {
    const y = 392 + 285 * Math.pow(rnd(), 0.85);
    const d = (y - 390) / 285;
    const big = rnd() < 0.06 ? 3 : 1;
    rocks.push({ x: 400 + rnd() * 1340, y, s: (0.6 + rnd() * rnd() * 6 * big) * (0.35 + d * 2.4), d });
  }
  rocks.sort((a, b) => a.y - b.y);
  for (const r of rocks) {
    const { x, y, s } = r;
    fill(blob(x - s * 0.8, y + s * 0.12, s * 1.9, s * 0.36, 7, 0.2), '#5a200e', 0.35);
    const body = blob(x, y - s * 0.38, s, s * 0.62, 7, 0.28);
    fill(body, C.rock);
    withClip(body, () => fill(blob(x + s * 0.35, y - s * 0.75, s * 0.8, s * 0.45, 7, 0.2), C.rockLit, 0.85));
  }
  // low dust hanging over the plain
  rect(400, 330, 1340, 140, lg(0, 330, 0, 470, 0, 'rgba(240,170,110,0)', 0.5, 'rgba(240,170,110,0.22)', 1, 'rgba(240,170,110,0)'));
}

// ---------------------------------------------------------------------------
// The room
// ---------------------------------------------------------------------------
function drawRoom() {
  seed = 4242;
  // base darkness
  rect(OX, OY, FW, FH, C.shadow);

  // ---- floor
  const floor = P([[62, 1030], [1080, 1030], [1060, 1252], [62, 1252]]);
  fill(floor, lg(0, 1030, 0, 1252, 0, '#5a3426', 0.5, '#7a4a30', 1, '#4a2a1c'));
  withClip(floor, () => {
    rect(300, 1030, 800, 222, rg(780, 1090, 0, 520, 0, 'rgba(255,190,130,0.55)', 1, 'rgba(255,170,110,0)'));
    for (const [x1, x2] of [[150, 1000], [120, 1050]]) line(x1, 1110 + rnd() * 60, x2, 1120 + rnd() * 60, 2, '#3b2117', 0.4);
    line(380, 1030, 200, 1252, 2, '#3b2117', 0.35);
    line(820, 1030, 980, 1252, 2, '#3b2117', 0.3);
    // reflections of the light strips
    rect(330, 1035, 220, 40, rg(440, 1050, 0, 140, 0, 'rgba(255,214,160,0.55)', 1, 'rgba(255,200,140,0)'));
    rect(560, 1150, 520, 100, rg(820, 1220, 0, 300, 0, 'rgba(255,214,160,0.35)', 1, 'rgba(255,200,140,0)'));
  });

  // ---- left wall
  const leftWall = P([[62, 205], [420, 205], [482, 420], [522, 606], [560, 720], [62, 760]]);
  fill(leftWall, lg(62, 0, 520, 0, 0, '#3e2519', 0.35, '#7a5440', 0.75, '#c69a74', 1, '#dfb991'));
  brush(leftWall, 260, ['#d9b08a', '#6b4532', '#a77e60'], 40, 3, 0.12, Math.PI / 2, [62, 205, 520, 760]);
  // panel seams
  line(110, 205, 110, 760, 3, '#2a1710', 0.6);
  line(300, 205, 300, 300, 2, '#3a2216', 0.5);
  line(232, 250, 232, 640, 2, '#3a2216', 0.35);
  line(150, 620, 470, 615, 3, '#2f1a11', 0.5);
  // tall light strip in the wall
  rect(258, 300, 24, 280, '#5a3a2a');
  // photos of Mars pinned to the wall
  for (const [x, y, w, h, r] of [[310, 318, 84, 88, -0.02], [316, 430, 78, 72, 0.03], [368, 520, 82, 68, -0.03]]) photo(x, y, w, h, r);
  // jacket hanging on a hook
  jacket();

  // ---- window, struts, sill
  withClip(WINDOW, drawMars);
  // glass sheen and haze
  withClip(WINDOW, () => {
    rect(400, 200, 1340, 480, lg(400, 200, 1300, 680, 0, 'rgba(255,230,190,0.06)', 0.5, 'rgba(255,230,190,0)', 1, 'rgba(255,200,150,0.08)'));
  });
  // left strut
  const ls = P([[372, 205], [430, 205], [496, 420], [538, 606], [500, 612], [458, 420]]);
  fill(ls, lg(372, 0, 538, 0, 0, '#9b7258', 0.55, C.frame, 0.85, C.frameLit, 1, '#ffe6c0'));
  line(430, 205, 538, 606, 3, '#fff0d4', 0.8);
  // central arched mullion
  const cm = new Path2D();
  cm.moveTo(826, 205); cm.quadraticCurveTo(892, 268, 902, 606);
  cm.lineTo(960, 606); cm.quadraticCurveTo(950, 250, 902, 205); cm.closePath();
  fill(cm, lg(840, 0, 960, 0, 0, '#a77f62', 0.5, C.frame, 1, C.frameLit));
  withClip(cm, () => {
    line(860, 205, 936, 606, 6, '#fff0d2', 0.35);
    line(844, 330, 958, 330, 3, '#7a5644', 0.3);
  });
  // right strut curving into the lower corner of the window
  const rs = new Path2D();
  rs.moveTo(1555, 205); rs.quadraticCurveTo(1690, 290, 1700, 540);
  rs.quadraticCurveTo(1702, 640, 1620, 664);
  rs.lineTo(1640, 700); rs.quadraticCurveTo(1772, 670, 1766, 520);
  rs.quadraticCurveTo(1750, 270, 1650, 205); rs.closePath();
  fill(rs, lg(1600, 0, 1770, 0, 0, C.frameLit, 0.45, C.frame, 1, '#8e6650'));
  withClip(rs, () => {
    line(1590, 205, 1712, 560, 5, '#fff0d4', 0.45);
    rect(1690, 400, 20, 160, 'rgba(255,240,210,0.25)');
  });
  // sill + lower frame
  const sill = new Path2D();
  sill.moveTo(500, 604); sill.lineTo(1120, 604); sill.quadraticCurveTo(1190, 626, 1250, 666);
  sill.lineTo(1640, 666); sill.lineTo(1650, 712); sill.lineTo(1230, 712);
  sill.quadraticCurveTo(1170, 672, 1120, 655); sill.lineTo(540, 655); sill.closePath();
  fill(sill, lg(0, 604, 0, 712, 0, '#ffe2b6', 0.35, C.frame, 1, '#8a6250'));
  line(520, 606, 1120, 606, 3, '#fff3dc', 0.7);

  // ---- right wall, shelves, hanging plants
  const rw = P([[1740, 205], [1967, 205], [1967, 800], [1700, 800], [1700, 700], [1760, 560]]);
  fill(rw, lg(1700, 0, 1967, 0, 0, '#c99f78', 0.4, '#a77d5e', 1, '#6e4a36'));
  brush(rw, 140, ['#e2bc92', '#5e3c2a'], 35, 3, 0.12, Math.PI / 2, [1700, 205, 1967, 800]);
  line(1790, 205, 1790, 800, 3, '#3a2216', 0.45);
  rect(1760, 250, 26, 140, '#5a3c2c', 0.7);
  rect(1830, 290, 140, 14, '#e4c39c'); rect(1830, 304, 140, 8, '#6e4a36');
  rect(1845, 568, 125, 14, '#e4c39c'); rect(1845, 582, 125, 8, '#6e4a36');
  fill(blob(1915, 232, 60, 38, 9, 0.1), lg(1860, 200, 1960, 270, 0, '#b0643a', 1, '#5a2c18'));
  rect(1880, 430, 90, 110, '#4a2e22', 0.7);
  hangingPlant(1880, 300, 1);
  hangingPlant(1835, 360, 0.8);

  // wall below the window on the right
  const lw2 = P([[1150, 668], [1260, 712], [1700, 712], [1700, 790], [1150, 790]]);
  fill(lw2, lg(0, 668, 0, 790, 0, '#c99d76', 1, '#9a7056'));
  rect(1340, 726, 220, 18, '#5a3a2a', 0.8);
  // books and a small device on the counter
  rect(1262, 744, 98, 14, '#8a5a3c'); rect(1268, 732, 86, 13, '#c09070'); rect(1275, 722, 70, 11, '#6e4a36');
  rect(1268, 732, 86, 3, '#f0c896', 0.6);

  // ---- right counter (runs behind the bed)
  const rc = P([[1150, 772], [1967, 772], [1967, 880], [1150, 880]]);
  fill(rc, lg(0, 772, 0, 880, 0, '#e8c8a0', 0.18, '#c8a07c', 0.22, '#8c644e', 1, '#5c3c2c'));
  for (const x of [1280, 1480, 1700, 1880]) line(x, 795, x, 880, 2, '#3a2216', 0.4);
  line(1150, 772, 1967, 772, 3, '#fff0d4', 0.55);

  // ---- desk
  const top = P([[300, 700], [1160, 706], [1180, 742], [300, 742]]);
  fill(top, lg(0, 700, 0, 742, 0, '#f2d3ab', 0.5, '#d8b08a', 1, '#a77d60'));
  line(300, 702, 1160, 707, 3, '#fff1d6', 0.7);
  const front = P([[330, 742], [1160, 742], [1160, 1046], [330, 1046]]);
  fill(front, lg(330, 0, 1160, 0, 0, '#4a2e22', 0.45, '#7e5a44', 1, '#9a7054'));
  brush(front, 220, ['#c9a07c', '#4e3022'], 30, 3, 0.12, Math.PI / 2, [330, 742, 1160, 1046]);
  rect(330, 742, 830, 30, '#3a2216', 0.35);
  // cabinet doors and drawers
  for (const [x, y, w, h] of [[690, 772, 140, 270], [842, 772, 140, 120], [842, 900, 140, 142], [994, 772, 160, 270]]) {
    const d = P([[x, y], [x + w, y], [x + w, y + h], [x, y + h]]);
    fill(d, lg(x, 0, x + w, 0, 0, '#7a5844', 1, '#a47e60'));
    line(x, y, x + w, y, 2, '#e8c49c', 0.6);
    line(x + w, y, x + w, y + h, 2, '#3a2216', 0.5);
    rect(x + w / 2 - 22, y + 18, 44, 8, '#4a2e22', 0.7);
  }
  rect(840, 780, 3, 260, '#3a2216', 0.5);
  // shadow under the desk top on the left where the chair sits
  rect(330, 742, 360, 304, lg(0, 742, 0, 1046, 0, 'rgba(30,14,8,0.55)', 1, 'rgba(30,14,8,0.25)'));

  // desk props
  deskProps();

  // ---- left side clutter
  // shelf with bottles
  rect(150, 600, 260, 14, '#d9b48c'); rect(150, 614, 260, 10, '#4a2e22');
  for (const [x, h, c] of [[244, 38, '#8a5a3c'], [262, 52, '#c48a5a'], [290, 30, '#6e4a36'], [318, 44, '#a87a5a'], [338, 26, '#d6a878'], [360, 36, '#7a5444']]) {
    rect(x, 600 - h, 14, h, lg(x, 0, x + 14, 0, 0, '#3a2216', 1, c));
  }
  // white storage crates
  crate(80, 660, 170, 120);
  crate(70, 800, 190, 140);

function hangingPlant(x, y, k) {
  for (let v = 0; v < 6; v++) {
    let px = x + rr(30) * k, py = y;
    const len = (140 + rnd() * 260) * k;
    const sway = rr(1);
    for (let t = 0; t < len; t += 9) {
      px += Math.sin(t * 0.03 + v) * 1.5 + sway * 0.6;
      py += 9;
      const s = (6 + rnd() * 7) * k;
      const lit = px < x ? 0.9 : 0.4;
      const side = rnd() < 0.5 ? -1 : 1;
      leaf(px, py, s * 2.2, s * 0.8, side < 0 ? Math.PI - 0.6 + rr(0.5) : 0.6 + rr(0.5), rnd() < 0.5 ? C.leafDark : C.leaf, rnd() < lit ? C.leafLit : null);
    }
  }
}

  line(690, 806, 696, 862, 10, '#8a7a6e');

// ---------------------------------------------------------------------------
// Ambient motion: dust in the light, a slow haze drifting outside
// ---------------------------------------------------------------------------
const motes = Array.from({ length: 70 }, (_, i) => ({
  x: 500 + ((i * 7919) % 900), y: 300 + ((i * 104729) % 650),
  r: 1 + (i % 5) * 0.6, s: 0.3 + (i % 7) * 0.08, ph: i * 1.7,
}));
function drawAmbient(t) {
  withClip(WINDOW, () => {
    for (let k = 0; k < 3; k++) {
      const x = 400 + ((t * (8 + k * 5) + k * 500) % 1700) - 200;
      rect(400, 200, 1340, 480, rg(x, 340 + k * 60, 0, 300, 0, 'rgba(245,175,120,0.10)', 1, 'rgba(245,175,120,0)'));
    }
  });
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    const x = m.x + Math.sin(t * m.s + m.ph) * 30 + t * 4 % 40;
    const y = m.y + Math.cos(t * m.s * 0.8 + m.ph) * 20 - (t * m.s * 6) % 60;
    const a = 0.25 + 0.25 * Math.sin(t * 1.3 + m.ph);
    g.fillStyle = `rgba(255,210,160,${a.toFixed(3)})`;
    g.beginPath(); g.arc(x, y, m.r, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}

// ---------------------------------------------------------------------------
// Composition
// ---------------------------------------------------------------------------
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const back = document.createElement('canvas');   // room behind the boy
const front = document.createElement('canvas');  // bed, helmet, plant, glows, grade
let scale = 1, dpr = 1;

function setView(c) {
  const k = scale * dpr;
  c.setTransform(k, 0, 0, k, -OX * k, -OY * k);
}
function grade(c) {
  g = c;
  g.setTransform(1, 0, 0, 1, 0, 0);
  const w = c.canvas.width, h = c.canvas.height;
  // vignette
  const v = g.createRadialGradient(w * 0.55, h * 0.42, h * 0.3, w * 0.5, h * 0.5, h * 1.05);
  v.addColorStop(0, 'rgba(20,8,4,0)'); v.addColorStop(1, 'rgba(20,8,4,0.55)');
  g.fillStyle = v; g.fillRect(0, 0, w, h);
  // grain
  const gc = document.createElement('canvas');
  gc.width = gc.height = 200;
  const gx = gc.getContext('2d'), img = gx.createImageData(200, 200);
  seed = 5;
  for (let i = 0; i < img.data.length; i += 4) {
    const n = rnd() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = n; img.data[i + 3] = 14;
